<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWS ARCHIVE | 管理员认证</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Inter:wght@200;300&display=swap');
        :root { --mws-black: #000000; --mws-white: #ffffff; --mws-gray: #f2f2f2; }
        body { font-family: 'Inter', sans-serif; background-color: var(--mws-white); color: var(--mws-black); overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .bg-line { position: absolute; background: #000; opacity: 0.03; z-index: 0; }
        .login-card { width: 100%; max-width: 450px; padding: 80px 60px; background: #fff; position: relative; z-index: 10; text-align: center; }
        .logo-area { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 200; letter-spacing: 0.8em; text-transform: uppercase; margin-bottom: 60px; margin-left: 0.8em; }
        .input-group { position: relative; margin-bottom: 40px; text-align: left; }
        .input-group label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #ccc; display: block; margin-bottom: 10px; margin-left: 2px; }
        .mws-input { width: 100%; border: none; border-bottom: 1px solid #e5e5e5; padding: 12px 2px; font-size: 13px; font-weight: 300; letter-spacing: 0.1em; outline: none; transition: border-color 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .mws-input:focus { border-color: var(--mws-black); }
        .btn-login { width: 100%; background: var(--mws-black); color: var(--mws-white); padding: 20px; font-size: 11px; font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase; margin-top: 30px; transition: all 0.4s; position: relative; overflow: hidden; }
        .btn-login:hover { opacity: 0.8; letter-spacing: 0.6em; }
        .btn-login:disabled { background: #999; opacity: 0.6; cursor: not-allowed; letter-spacing: 0.5em; }
        .back-home { margin-top: 40px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #aaa; text-decoration: none; display: inline-block; transition: 0.3s; }
        .back-home:hover { color: #000; }
        .error-tip { font-size: 9px; color: #ff4444; letter-spacing: 0.1em; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="bg-line w-[1px] h-full left-[20%]"></div>
    <div class="bg-line w-full h-[1px] top-[40%]"></div>

    <main class="login-card animate__animated animate__fadeIn">
        <div class="logo-area">MWS Studio</div>
        <div class="space-y-2">
            <div class="input-group">
                <label>Administrator / 账号</label>
                <input type="text" id="admin-user" class="mws-input" placeholder="admin" autocomplete="off" value="admin">
            </div>
            <div class="input-group">
                <label>Security Key / 密钥</label>
                <input type="password" id="admin-pass" class="mws-input" placeholder="PASSWORD">
            </div>
            <div class="error-tip" id="errorTip"></div>
            <button onclick="handleAdminLogin()" class="btn-login" id="loginBtn">Verify & Enter</button>
        </div>
        <a href="index.html" class="back-home">← Back to Archive / 返回陈列馆</a>
    </main>

    <script>
        // 获取DOM元素
        const loginBtn = document.getElementById('loginBtn');
        const errorTip = document.getElementById('errorTip');
        const userInput = document.getElementById('admin-user');
        const passInput = document.getElementById('admin-pass');

        async function handleAdminLogin() {
            const user = userInput.value.trim();
            const password = passInput.value;

            // 清空之前的错误提示
            errorTip.style.display = 'none';
            errorTip.textContent = '';

            // 基础校验
            if (!user) {
                showError('请输入管理员账号 / Please enter admin account');
                userInput.focus();
                return;
            }
            if (!password) {
                showError('请输入安全密钥 / Please enter security key');
                passInput.focus();
                return;
            }

            // 禁用登录按钮，防止重复点击
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';

            try {
                // 适配后端接口，兼容本地/线上环境
                const baseUrl = window.location.origin;
                const res = await fetch(`${baseUrl}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user, pass: password }),
                    timeout: 10000 // 超时时间10秒
                });

                // 处理HTTP状态码错误
                if (!res.ok) {
                    throw new Error(`服务器响应错误: ${res.status} ${res.statusText}`);
                }

                const data = await res.json();
                
                // ✅ 唯一调整：严格判断data存在且success为true，杜绝误跳转
                if (typeof data === 'object' && data !== null && data.success === true && data.user && data.user.role === 'admin') {
                    localStorage.setItem('mws_user', JSON.stringify(data.user));
                    document.querySelector('.login-card').classList.add('animate__animated', 'animate__fadeOutUp');
                    setTimeout(() => {
                        window.location.href = 'admin-console.html'; 
                    }, 500);
                } else {
                    // 显示后端返回的具体错误信息（兼容data为null/undefined的情况）
                    const errorMsg = (data && data.msg) || "权限不足或密码错误 / ACCESS DENIED";
                    showError(errorMsg);
                    // 重置按钮状态
                    resetLoginBtn();
                }
            } catch (err) {
                console.error("认证异常", err);
                // 区分不同错误类型，给出更友好的提示
                if (err.message.includes('Failed to fetch')) {
                    showError('无法连接到服务器 / Cannot connect to server');
                } else {
                    showError('系统连接异常，请稍后重试 / System error, please retry later');
                }
                resetLoginBtn();
            }
        }

        // 显示错误提示
        function showError(msg) {
            errorTip.textContent = msg;
            errorTip.style.display = 'block';
            // 添加错误动画（可选）
            errorTip.classList.add('animate__animated', 'animate__shakeX');
            setTimeout(() => {
                errorTip.classList.remove('animate__shakeX');
            }, 500);
        }

        // 重置登录按钮状态
        function resetLoginBtn() {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Verify & Enter';
        }

        // 回车登录
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !loginBtn.disabled) {
                handleAdminLogin();
            }
        });

        // 页面加载时自动填充admin账号（提升体验）
        window.onload = function() {
            if (!userInput.value) {
                userInput.value = 'admin';
            }
        };
    </script>
</body>
</html>
