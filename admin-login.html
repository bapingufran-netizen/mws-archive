<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - MWS Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-dim);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #2563eb;
        }

        .login-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none; /* 默认隐藏 */
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="brand-header">
            <h1>MWS Archive</h1>
            <p>Admin Management Console</p>
        </div>

        <div id="errorMessage" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span>用户名或密码错误</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">管理员账号</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="请输入 ID" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">安全密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="请输入密码" required>
                    <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">登录系统</button>
        </form>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const eyeIcon = document.getElementById('eyeIcon');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMessage');

    // 1. 切换密码可见性
    eyeIcon.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });

    // 2. 登录逻辑处理
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // 锁定按钮防止重复提交
        btn.disabled = true;
        btn.innerText = '正在验证...';
        errorMsg.style.display = 'none';

        try {
            /** * 这里后续需要对接你的真实 API
             * 目前作为示例，假设正确账号为 admin，密码为 123456
             **/
            if (user === 'admin' && pass === '123456') {
                // 模拟 API 返回成功并存储 token
                localStorage.setItem('mws_auth_status', 'authorized');
                localStorage.setItem('login_time', Date.now());
                
                // 跳转到你提供的那个管理后台页面
                window.location.href = 'admin-console.html';
            } else {
                throw new Error('鉴权失败');
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            btn.disabled = false;
            btn.innerText = '登录系统';
        }
    });
</script>

</body>
</html>
