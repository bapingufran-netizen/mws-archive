<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWS ARCHIVE | 管理员认证</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Inter:wght@200;300&display=swap');
        :root { --mws-black: #000000; --mws-white: #ffffff; --mws-gray: #f2f2f2; }
        body { font-family: 'Inter', sans-serif; background-color: var(--mws-white); color: var(--mws-black); overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .bg-line { position: absolute; background: #000; opacity: 0.03; z-index: 0; }
        .login-card { width: 100%; max-width: 450px; padding: 80px 60px; background: #fff; position: relative; z-index: 10; text-align: center; }
        .logo-area { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 200; letter-spacing: 0.8em; text-transform: uppercase; margin-bottom: 60px; margin-left: 0.8em; }
        .input-group { position: relative; margin-bottom: 40px; text-align: left; }
        .input-group label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #ccc; display: block; margin-bottom: 10px; margin-left: 2px; }
        .mws-input { width: 100%; border: none; border-bottom: 1px solid #e5e5e5; padding: 12px 2px; font-size: 13px; font-weight: 300; letter-spacing: 0.1em; outline: none; transition: border-color 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .mws-input:focus { border-color: var(--mws-black); }
        .btn-login { width: 100%; background: var(--mws-black); color: var(--mws-white); padding: 20px; font-size: 11px; font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase; margin-top: 30px; transition: all 0.4s; position: relative; overflow: hidden; cursor: pointer; }
        .btn-login:hover { opacity: 0.8; letter-spacing: 0.6em; }
        .btn-login:disabled { background: #999; opacity: 0.6; cursor: not-allowed; letter-spacing: 0.5em; }
        .back-home { margin-top: 40px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #aaa; text-decoration: none; display: inline-block; transition: 0.3s; }
        .back-home:hover { color: #000; }
        .error-tip { font-size: 9px; color: #ff4444; letter-spacing: 0.1em; margin-top: 10px; display: block; height: 12px; }
    </style>
</head>
<body>
    <div class="bg-line w-[1px] h-full left-[20%]"></div>
    <div class="bg-line w-full h-[1px] top-[40%]"></div>

    <main class="login-card animate__animated animate__fadeIn">
        <div class="logo-area">MWS Studio</div>
        <div class="space-y-2">
            <div class="input-group">
                <label>Administrator / 账号</label>
                <input type="text" id="admin-user" class="mws-input" placeholder="admin" autocomplete="off" value="admin">
            </div>
            <div class="input-group">
                <label>Security Key / 密钥</label>
                <input type="password" id="admin-pass" class="mws-input" placeholder="请输入密钥">
            </div>
            <div class="error-tip" id="errorTip"></div>
            <button onclick="handleAdminLogin()" class="btn-login" id="loginBtn">Verify & Enter</button>
        </div>
        <a href="index.html" class="back-home">← Back to Archive / 返回陈列馆</a>
    </main>

   <script>
    const loginBtn = document.getElementById('loginBtn');
    const errorTip = document.getElementById('errorTip');
    const userInput = document.getElementById('admin-user');
    const passInput = document.getElementById('admin-pass');

    // 1. 确保这里的账号密码是你想要的
    const CORRECT_USER = "admin";
    const CORRECT_KEY = "mwsadmin123";

    async function handleAdminLogin() {
        const user = userInput.value.trim();
        const password = passInput.value;

        errorTip.textContent = '';
        
        if (!user || !password) {
            errorTip.textContent = '请完整填写账号和密钥';
            return;
        }

        if (user === CORRECT_USER && password === CORRECT_KEY) {
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';

            try {
                // --- 【精准修复点】统一 Key 的命名 ---
                // 为了兼容你后台页面的检查脚本，我们存入一个简单的 'true' 值
                localStorage.setItem('mws_admin_token', 'true'); 
                
                // 同时保留你的用户信息记录（可选）
                localStorage.setItem('mws_user', JSON.stringify({
                    user: user,
                    role: 'admin',
                    timestamp: new Date().getTime()
                }));

                console.log("验证通过，正在跳转...");
                
                // 确保跳转到正确的文件名（请确认你的后台文件名是 admin-console.html 还是 admin-data.html）
                window.location.replace('admin-console.html');

            } catch (err) {
                console.error("Storage Error:", err);
                errorTip.textContent = '浏览器存储异常，请检查隐私模式';
                loginBtn.disabled = false;
            }
        } else {
            errorTip.textContent = '账号或安全密钥错误，请重试';
            passInput.value = '';
            passInput.focus();
        }
    }

    // 监听回车键
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !loginBtn.disabled) {
            handleAdminLogin();
        }
    });

    window.onload = () => {
        passInput.focus();
    };
</script>
</body>
</html>
