<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - MWS Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --input-bg: #0f172a;
            --error-red: #ef4444;
        }

        /* 入场动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 抖动动画（登录失败时触发） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeInDown 0.6s ease-out;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 10px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.prefix-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            transition: color 0.2s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background: var(--input-bg);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .input-wrapper input:focus + i.prefix-icon {
            color: var(--primary-blue);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-dim);
            padding: 5px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-red);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="brand-header">
            <h1>MWS Archive</h1>
            <p>Admin Management Console</p>
        </div>

        <div id="errorMessage" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span>用户名或密码错误</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <label for="username">管理员账号</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="请输入 ID" required>
                    <i class="fas fa-user prefix-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">安全密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="请输入密码" required>
                    <i class="fas fa-lock prefix-icon"></i>
                    <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">登 录 系 统</button>
        </form>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const eyeIcon = document.getElementById('eyeIcon');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMessage');
    const btn = document.getElementById('submitBtn');

    // 1. 切换密码可见性逻辑
    eyeIcon.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });

    // 2. 登录逻辑处理
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // UI 反馈
        btn.disabled = true;
        btn.innerText = '正在验证...';
        errorMsg.style.display = 'none';

        // 模拟网络请求延迟
        setTimeout(() => {
            if (user === 'admin' && pass === '123456') {
                // 存储认证状态
                localStorage.setItem('mws_auth_status', 'authorized');
                localStorage.setItem('login_time', Date.now());
                
                // 登录成功跳转
                window.location.href = 'admin-console.html';
            } else {
                // 登录失败处理
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = '登 录 系 统';
                
                // 触发抖动动画
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                // 强制重绘触发动画
                void card.offsetWidth; 
                card.style.animation = 'shake 0.4s ease-in-out';
            }
        }, 600);
    });
</script>

</body>
</html>
