<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | MR WANG SILK 品牌故事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Inter:wght@200;300;400&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; } 

        /* 杂志排版核心：超大字间距与纤细字体 */
        .editorial-title { 
            font-family: 'Montserrat', sans-serif; 
            letter-spacing: 0.8em; 
            text-transform: uppercase; 
            font-weight: 200;
        }
        .section-tag { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 10px; 
            letter-spacing: 0.4em; 
            color: #ccc; 
            text-transform: uppercase;
        }
        
        /* 呼吸感正文：2.8倍行高 */
        .content-body { 
            font-weight: 300; 
            line-height: 2.8; 
            letter-spacing: 0.1em; 
            color: #444; 
            text-align: justify;
        }
        
        /* 图片画框效果 */
        .img-frame {
            padding: 15px;
            background: #fcfcfc;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .img-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: all 1.5s ease;
        }
        .img-frame:hover img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        /* 极简页眉，与主站对齐 */
        .brand-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            z-index: 100; border-bottom: 0.5px solid #f0f0f0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </
