<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>MR WANG SILK | OFFICIAL SITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #fff; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; } 

        .brand-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 100;
            border-bottom: 0.5px solid #f0f0f0;
        }

        .side-nav {
            position: fixed; left: 40px; top: 160px; z-index: 90; width: 220px;
            height: calc(100vh - 200px); overflow-y: auto; padding-bottom: 50px;
        }
        .nav-link {
            font-size: 11px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
            color: #ccc; margin-bottom: 24px; cursor: pointer; display: block;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .nav-link:hover, .nav-link.active { color: #000; transform: translateX(8px); }

        .hero-banner { height: 85vh; width: 100%; position: relative; margin-top: 120px; overflow: hidden; background: #000; }
        .hero-video-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: transform 1.5s ease; }

        .product-card { transition: opacity 0.8s ease, transform 0.8s ease; opacity: 0; transform: translateY(30px); }
        .product-card.visible { opacity: 1; transform: translateY(0); }

        .brand-story-section { padding: 150px 10%; background: #f9f9f9; text-align: center; }
        .story-content-wrapper { 
            max-width: 1200px; margin: 0 auto; display: grid; gap: 80px; 
            grid-template-columns: 1fr; align-items: center;
        }
        @media (min-width: 1024px) { .story-content-wrapper { grid-template-columns: 1fr 1fr; } }
        .story-text { font-weight: 200; line-height: 2.2; letter-spacing: 0.15em; color: #333; text-align: left; }
        .story-image { 
            width: 100%; height: auto; object-fit: cover; border-radius: 2px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
        }

        #auth-modal { backdrop-filter: blur(20px); background: rgba(255,255,255,0.7); display: none; }
        .auth-input { background: #f9f9f9; border-bottom: 1px solid #eee; transition: 0.3s; }
