<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>M.W.S 工作室 | 档案与产品管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', "Microsoft YaHei", sans-serif; background: #fafafa; color: #000; }
        .bold-text { font-weight: 700 !important; letter-spacing: 0.1em; }
        .studio-input { border-bottom: 2px solid #f0f0f0; padding: 12px 0; outline: none; transition: 0.3s; width: 100%; background: transparent; font-size: 14px; }
        .studio-input:focus { border-bottom-color: #000; }
        .inventory-scroll { height: calc(100vh - 250px); overflow-y: auto; scrollbar-width: none; }
        .main-card { background: #fff; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.03); }
        .status-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 900; }
        .tag-draft { background: #eee; color: #999; }
        .tag-live { background: #000; color: #fff; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="overflow-hidden bg-[#fafafa]">

    <div class="flex h-screen">
        <aside class="w-96 border-r border-zinc-100 flex flex-col p-8 bg-white">
            <div class="mb-10">
                <h1 class="text-xl font-black tracking-tighter mb-1">工作室管理</h1>
                <p class="text-[10px] text-zinc-300 font-bold uppercase tracking-widest">M.W.S STUDIO / ARCHIVE</p>
            </div>

            <div class="flex-1 min-h-0">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[11px] font-black uppercase tracking-widest text-zinc-400">产品列表 / PRODUCT LIST</span>
                    <button onclick="resetEditor()" class="w-8 h-8 bg-black text-white rounded-full text-xl flex items-center justify-center hover:rotate-90 transition-all">+</button>
                </div>
                <div id="inventory-list" class="inventory-scroll space-y-3"></div>
            </div>

            <button onclick="location.href='admin-console.html'" class="mt-6 text-[10px] font-bold text-zinc-400 hover:text-black transition text-left uppercase tracking-widest">← 返回控制台 / BACK</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-12">
            <div class="max-w-6xl mx-auto">
                <div class="main-card p-10">
                    <div class="grid grid-cols-12 gap-12 mb-16">
                        <div class="col-span-5">
                            <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-4">封面主图 / MAIN COVER</label>
                            <div id="drop-zone" onclick="document.getElementById('main-file').click()" class="aspect-[3/4] bg-zinc-50 rounded-[2rem] border-2 border-dashed border-zinc-100 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group hover:border-black transition-all">
                                <img id="main-preview" class="hidden w-full h-full object-cover">
                                <div id="placeholder" class="text-center">
                                    <p class="text-[10px] font-black text-zinc-300 uppercase">点击同步云端主图</p>
                                </div>
                                <input type="file" id="main-file" hidden onchange="handleMainUpload(this)">
                            </div>
                        </div>

                        <div class="col-span-7 space-y-8">
                            <div>
                                <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-2">产品名称 / ITEM NAME</label>
                                <input type="text" id="p-name" class="studio-input text-xl font-bold" placeholder="请输入品名...">
                            </div>

                            <div class="grid grid-cols-2 gap-8">
                                <div>
                                    <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-2">基础定价 / BASE PRICE (¥)</label>
                                    <input type="number" id="p-price" class="studio-input" placeholder="0.00" oninput="syncAllPrices(this.value)">
                                </div>
                                <div>
                                    <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-2">所属系列 / COLLECTION</label>
                                    <select id="p-category" class="studio-input">
                                        <option value="Silk Series">真丝系列 / Silk Series</option>
                                        <option value="Atelier">手工坊 / Atelier</option>
                                        <option value="Archive">经典档案 / Archive</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-2">品牌叙事描述 / DESCRIPTION</label>
                                <textarea id="p-desc" class="studio-input h-32 resize-none" placeholder="为此作品撰写叙事内容，将展示在产品详情页..."></textarea>
                            </div>

                            <div>
                                <label class="text-[11px] font-black text-zinc-400 uppercase tracking-widest block mb-4">细节展示图 / DETAILS</label>
                                <div class="grid grid-cols-5 gap-3" id="detail-preview-grid">
                                    <div onclick="document.getElementById('detail-files').click()" class="aspect-square bg-zinc-50 border border-dashed border-zinc-200 rounded-xl flex items-center justify-center cursor-pointer hover:border-black transition text-zinc-300">+</div>
                                </div>
                                <input type="file" id="detail-files" hidden multiple onchange="handleDetailUpload(this)">
