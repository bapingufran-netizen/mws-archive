<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>M.W.S | 视觉引擎配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@700&display=swap');
        
        body { font-family: 'Inter', "Microsoft YaHei", sans-serif; background: #fcfcfc; color: #000; }
        
        /* 💡 关键改进：文字框现在可以自由上下拉伸 */
        textarea { 
            resize: vertical; 
            min-height: 100px; 
            border: 1px solid #eee;
            transition: all 0.3s ease;
        }
        textarea:focus { border-color: #000; background: #fff; }

        .config-card { 
            background: #fff;
            border: 1px solid #efefef; 
            border-radius: 4px; /* 保持硬朗工业风 */
            transition: 0.3s; 
        }
        .config-card:hover { border-color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        /* 🖼️ 实时预览区：解决图片上传后看不见的问题 */
        .preview-container {
            width: 100%;
            height: 160px;
            background: #f9f9f9;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }
        .preview-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 滑块样式 */
        input[type=range] { accent-color: #000; cursor: pointer; }

        .btn-press:active { transform: scale(0.98); }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #000; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 w-full z-50 px-8 lg:px-12 py-6 bg-white border-b-2 border-black flex justify-between items-center">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase">M.W.S / DESIGN</h1>
            <button onclick="location.href='admin-console.html'" class="text-[10px] font-bold tracking-widest uppercase hover:underline">返回中枢</button>
        </div>
        <button id="save-btn" onclick="saveAllConfigs()" class="bg-black text-white px-10 py-3 text-[11px] font-black uppercase btn-press shadow-xl transition-all hover:bg-zinc-800">应用全局变更</button>
    </nav>

    <main class="pt-40 px-8 lg:px-24 pb-24 max-w-7xl mx-auto">
        <header class="mb-20">
            <h2 class="text-6xl font-light tracking-tighter mb-4">视觉引擎</h2>
            <p class="text-[10px] font-bold text-zinc-400 tracking-[0.4em] uppercase">Display Engine & Layout Configuration</p>
            <div class="w-16 h-[2px] bg-black mt-8"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#01 / Banner 视觉</p>
                <h3 class="text-xl font-black mb-8 leading-none">首屏大图管理</h3>
                <div class="space-y-8">
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">当前首选大图 URL</p>
                        <input type="text" id="hero-url-input" class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition" oninput="updateLivePreview('hero-url-input', 'hero-preview')">
                        <div class="preview-container"><img id="hero-preview" src=""></div>
                        <button onclick="openUploadWidget('hero-url-input')" class="w-full mt-4 py-3 bg-zinc-50 border border-zinc-200 text-[9px] font-bold tracking-[0.2em] uppercase hover:bg-black hover:text-white transition duration-500">Cloudinary 智能上传</button>
                    </div>
                </div>
            </section>

            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#02 / Announcements</p>
                <h3 class="text-xl font-black mb-8 leading-none">全站置顶公告栏</h3>
                <div class="space-y-8">
                    <div class="flex justify-between items-center py-2 border-b border-zinc-100">
                        <span class="text-sm font-bold">启用顶部通知</span>
                        <input type="checkbox" id="showNotice" class="w-5 h-5 accent-black cursor-pointer">
                    </div>
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">公告内容 (支持中文)</p>
                        <textarea id="noticeContent" class="w-full p-4 text-sm outline-none bg-zinc-50 focus:bg-white transition" placeholder="输入公告..."></textarea>
                    </div>
                </div>
            </section>

            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#03 / Typography</p>
                <h3 class="text-xl font-black mb-8 leading-none">排版字号调节</h3>
                <div class="space-y-8">
                    <div>
                        <div class="flex justify-between mb-4">
                            <p class="text-[10px] font-bold text-zinc-400 uppercase">侧边栏导航字号</p>
                            <span id="size-display" class="text-xs font-bold">18px</span>
                        </div>
                        <input type="range" id="fontSizeSlider" min="14" max="24" value="18" class="w-full h-1 bg-zinc-200 rounded-lg appearance-none" oninput="updateFontSize(this.value)">
                    </div>
                </div>
            </section>

            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#04 / Footer Aesthetics</p>
                <h3 class="text-xl font-black mb-8 leading-none">底部展示区域自定义</h3>
                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">底部小标题</p>
                        <input type="text" id="footer-title-input" class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition">
                    </div>
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">描述文字</p>
                        <textarea id="footer-desc-input" class="w-full p-4 text-sm outline-none bg-zinc-50 focus:bg-white transition"></textarea>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">展示图 URL</p>
                        <input type="text" id="footer-img-input" class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition" oninput="updateLivePreview('footer-img-input', 'footer-preview')">
                        <div class="preview-container"><img id="footer-preview" src=""></div>
                        <button onclick="openUploadWidget('footer-img-input')" class="w-full mt-4 py-3 bg-zinc-50 border border-zinc-200 text-[9px] font-bold tracking-[0.2em] uppercase hover:bg-black hover:text-white transition duration-500">上传底部展示图</button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        // 保持你原始的配置不变
        const cloudName = "dbyud7vlz"; 
        const uploadPreset = "aliang"; 
        const ADMIN_AUTH_KEY = "MWS2026"; 

        // 🖼️ 实时预览逻辑：不破坏原有逻辑，仅增加视觉反馈
        function updateLivePreview(inputId, imgId) {
            const url = document.getElementById(inputId).value;
            if(url) document.getElementById(imgId).src = url;
        }

        function updateFontSize(val) {
            document.getElementById('size-display').innerText = val + 'px';
            // 注意：这里不直接操作 index.html，数据会随 saveAllConfigs 一起发送
        }

        function openUploadWidget(targetId) {
            cloudinary.openUploadWidget({
                cloudName: cloudName,
                uploadPreset: uploadPreset,
                sources: ['local', 'url'],
                cropping: true,
                multiple: false,
                theme: "minimal"
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const url = result.info.secure_url;
                    document.getElementById(targetId).value = url;
                    // 自动刷新预览图
                    const previewId = targetId === 'hero-url-input' ? 'hero-preview' : 'footer-preview';
                    document.getElementById(previewId).src = url;
                }
            });
        }

        async function fetchCurrentConfigs() {
            try {
                const res = await fetch('/api/settings');
                const config = await res.json();
                
                // 严格匹配原始 ID
                if (config.hero_banner) {
                    document.getElementById('hero-url-input').value = config.hero_banner;
                    document.getElementById('hero-preview').src = config.hero_banner;
                }
                if (config.show_notice) document.getElementById('showNotice').checked = (config.show_notice === "true");
                if (config.notice_content) document.getElementById('noticeContent').value = config.notice_content;
                if (config.footer_title) document.getElementById('footer-title-input').value = config.footer_title;
                if (config.footer_desc) document.getElementById('footer-desc-input').value = config.footer_desc;
                if (config.footer_img) {
                    document.getElementById('footer-img-input').value = config.footer_img;
                    document.getElementById('footer-preview').src = config.footer_img;
                }
            } catch (err) { console.error("加载配置失败"); }
        }

        async function saveAllConfigs() {
            const btn = document.getElementById('save-btn');
            
            // 严格遵循你之前的 Payload 结构
            const payload = {
                "hero_banner": document.getElementById('hero-url-input').value,
                "show_notice": document.getElementById('showNotice').checked ? "true" : "false",
                "notice_content": document.getElementById('noticeContent').value,
                "footer_title": document.getElementById('footer-title-input').value,
                "footer_desc": document.getElementById('footer-desc-input').value,
                "footer_img": document.getElementById('footer-img-input').value
            };

            btn.innerText = "正在同步云端...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-mws-auth': ADMIN_AUTH_KEY },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerText = "变更已全站生效";
                    btn.style.backgroundColor = "#16a34a";
                }
            } catch (err) {
                btn.innerText = "同步失败";
                btn.style.backgroundColor = "#dc2626";
            }

            setTimeout(() => {
                btn.innerText = "应用全局变更";
                btn.style.backgroundColor = "#000";
                btn.disabled = false;
            }, 2000);
        }

        window.onload = fetchCurrentConfigs;
    </script>
</body>
</html>
