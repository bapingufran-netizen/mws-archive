<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>MR WANG SILK | 杭州真丝老王丝绸陈列馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        /* 引入圆润、饱满的 Montserrat 字体 */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #fff; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; } 

        .brand-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 100;
            border-bottom: 0.5px solid #f0f0f0;
        }

        #top-notice-bar {
            width: 100%; background: #000; color: #fff; font-size: 10px;
            padding: 8px 0; text-align: center; letter-spacing: 0.2em;
            text-transform: uppercase; font-weight: bold; display: none; 
        }

        .side-nav {
            position: fixed; left: 40px; top: 180px; z-index: 90; width: 250px;
            height: calc(100vh - 220px); overflow-y: auto; padding-bottom: 50px;
        }

        /* ✨ 导航美化：圆润且富有亲和力 (18px) */
        .nav-link {
            font-family: 'Montserrat', sans-serif; 
            font-size: 18px; 
            font-weight: 500; 
            letter-spacing: 0.05em; 
            text-transform: uppercase;
            color: #d1d1d1; 
            margin-bottom: 38px; 
            cursor: pointer; 
            display: block;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .nav-link:hover, .nav-link.active { color: #000; transform: translateX(12px); }

        .hero-banner { height: 85vh; width: 100%; position: relative; margin-top: 120px; overflow: hidden; background: #000; }
        .hero-video-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

        .product-card { transition: opacity 0.8s ease, transform 0.8s ease; opacity: 0; transform: translateY(30px); }
        .product-card.visible { opacity: 1; transform: translateY(0); }

        .brand-story-section { padding: 150px 10%; background: #f9f9f9; text-align: center; }
        .story-content-wrapper { max-width: 1200px; margin: 0 auto; display: grid; gap: 80px; grid-template-columns: 1fr; }
        @media (min-width: 1024px) { .story-content-wrapper { grid-template-columns: 1fr 1fr; } }
        .story-text { font-weight: 200; line-height: 2.2; letter-spacing: 0.15em; color: #333; text-align: left; }
        .story-image { width: 100%; height: auto; object-fit: cover; border-radius: 2px; }

        #auth-modal { backdrop-filter: blur(20px); background: rgba(255,255,255,0.7); display: none; }
        .auth-input { background: #f9f9f9; border-bottom: 1px solid #eee; transition: 0.3s; }
        
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="brand-header animate__animated animate__fadeInDown">
        <div id="top-notice-bar"></div>
        <div class="flex flex-col items-center justify-center flex-1">
            <h1 class="text-3xl font-light tracking-[0.5em] uppercase cursor-pointer" onclick="location.reload()">MR WANG SILK</h1>
            <p class="text-[9px] tracking-[0.4em] text-gray-400 mt-2 uppercase">Privé Collection</p>
        </div>
        <div class="absolute right-12 top-1/2 -translate-y-1/2 flex items-center gap-6">
            <button id="user-btn" onclick="openAuth()" class="text-[9px] border-b border-transparent pb-1 opacity-40 hover:opacity-100 transition uppercase tracking-widest font-bold">Login</button>
            <a href="studio.html" id="admin-link" class="hidden text-[9px] border-b border-black pb-1 opacity-40 hover:opacity-100 transition uppercase tracking-widest font-bold">Studio</a>
        </div>
    </header>

    <div id="auth-modal" class="fixed inset-0 z-[200] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-[380px] p-12 rounded-[2rem] shadow-2xl relative animate__animated animate__zoomIn">
            <button onclick="closeAuth()" class="absolute top-8 right-8 text-zinc-300 hover:text-black transition">✕</button>
            <div id="login-form">
                <h3 class="text-xs font-bold tracking-[0.3em] uppercase mb-10 text-center">Member Login</h3>
                <div class="space-y-6">
                    <input type="email" id="l-email" placeholder="EMAIL" class="auth-input w-full p-4 text-[10px] tracking-widest">
                    <input type="password" id="l-pass" placeholder="PASSWORD" class="auth-input w-full p-4 text-[10px] tracking-widest">
                    <button onclick="handleLogin()" class="w-full bg-black text-white py-4 text-[10px] font-bold uppercase tracking-[0.3em] rounded-xl active:scale-95 transition-all">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <section class="hero-banner">
        <img id="main-hero-img" src="" class="hero-video-bg" alt="Luxury Archive">
        <div class="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-white/60"></div>
        
        <div class="absolute bottom-[12%] left-1/2 -translate-x-1/2 text-center text-black w-full animate__animated animate__fadeInUp">
            <h2 class="text-4xl font-extralight tracking-[0.5em] mb-3 uppercase">M.W.S ARCHIVE</h2>
            <p class="text-[9px] tracking-[0.4em] font-bold uppercase opacity-30">Pure Silk & Cashmere Collection</p>
        </div>
    </section>

    <aside class="side-nav hidden lg:block animate__animated animate__fadeInLeft custom-scroll">
        <div class="text-[10px] text-gray-400 mb-14 tracking-widest uppercase font-bold">Collections / 核心序列</div>
        <div id="category-menu">
            <span class="nav-link active" onclick="filterCate('ALL')">ALL 作品预览</span>
            <span class="nav-link" onclick="filterCate('Silk Series')">SILK 真丝系列</span>
            <span class="nav-link" onclick="filterCate('Cashmere')">CASHMERE 羊绒系列</span>
            <span class="nav-link" onclick="filterCate('Atelier')">ATELIER 重磅成衣</span>
            <span class="nav-link" onclick="filterCate('Accessories')">ACCESSORIES 配饰</span>
            <span class="nav-link" onclick="filterCate('Bespoke')">BESPOKE 私人定制</span>
            <span class="nav-link" onclick="filterCate('Archive')">STORY 品牌故事</span>
        </div>
    </aside>

    <main class="lg:ml-[280px] p-12 lg:p-24 bg-white min-h-screen">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-16 gap-y-32"></div>
    </main>

    <section class="brand-story-section">
        <div class="story-content-wrapper">
            <div class="story-text">
                <h4 id="display-footer-title" class="text-[9px] font-bold uppercase tracking-widest mb-4">01. HERITAGE & CRAFT</h4>
                <p id="display-footer-desc" class="text-[11px] text-zinc-500 leading-relaxed max-w-xs"></p>
            </div>
            <div class="footer-image-container">
                <img id="display-footer-img" src="" class="story-image shadow-2xl" alt="Brand Story Image">
            </div>
        </div>
    </section>

    <footer class="py-20 border-t border-gray-100 text-center bg-[#f9f9f9]">
        <p class="text-[9px] tracking-[0.5em] text-gray-300 uppercase font-bold">© 2026 MR WANG SILK. All Rights Reserved.</p>
    </footer>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('mws_user')) || null;
        let allProducts = [];

        function checkAuth() {
            const btn = document.getElementById('user-btn');
            const adminLink = document.getElementById('admin-link');
            if (currentUser) {
                btn.innerText = `Account / ${currentUser.nickname || currentUser.username}`;
                if (currentUser.role === 'admin') adminLink.style.display = 'block';
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                renderGrid(allProducts);
            } catch (err) { console.error("Load Error"); }
        }

        function renderGrid(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(item => `
                <a href="detail.html?id=${item.id}" class="product-card group block">
                    <div class="aspect-[3/4] overflow-hidden bg-gray-50 mb-10 rounded-sm">
                        <img src="${item.image}" class="w-full h-full object-cover transition-transform duration-[2s] group-hover:scale-105">
                    </div>
                    <div class="space-y-4">
                        <h4 class="text-[11px] uppercase tracking-[0.4em] font-bold text-zinc-400">${item.category}</h4>
                        <div class="flex justify-between items-baseline">
                            <h2 class="text-[13px] uppercase tracking-[0.1em] font-medium">${item.name}</h2>
                            <p class="text-[12px] font-bold">¥ ${item.price}</p>
                        </div>
                    </div>
                </a>
            `).join('');
            setTimeout(() => { document.querySelectorAll('.product-card').forEach(card => card.classList.add('visible')); }, 100);
        }

        function filterCate(cate) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            if (window.event) window.event.target.classList.add('active');
            const filtered = cate === 'ALL' ? allProducts : allProducts.filter(p => p.category === cate);
            renderGrid(filtered);
        }

        // ✨ 视觉引擎：让后台设置重新关联
        async function applyLiveSettings() {
            try {
                const res = await fetch('/api/settings');
                const config = await res.json();
                
                // 1. 同步首屏 Banner
                if (config.hero_banner) document.getElementById('main-hero-img').src = config.hero_banner;
                
                // 2. 同步底部标题
                if (config.footer_title) document.getElementById('display-footer-title').innerText = config.footer_title;
                
                // 3. 同步底部描述
                if (config.footer_desc) document.getElementById('display-footer-desc').innerText = config.footer_desc;
                
                // 4. 同步底部展示图 (解决你提到的不起作用的问题)
                if (config.footer_img) {
                    const fImg = document.getElementById('display-footer-img');
                    if (fImg) fImg.src = config.footer_img;
                }
                
                const noticeBar = document.getElementById('top-notice-bar');
                if (noticeBar) {
                    noticeBar.style.display = (config.show_notice === "true") ? "block" : "none";
                    noticeBar.innerText = config.notice_content || "";
                }
            } catch (err) { console.error("Setting Sync Error"); }
        }

        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }

        window.onload = () => { applyLiveSettings(); loadProducts(); checkAuth(); };
    </script>
</body>
</html>
