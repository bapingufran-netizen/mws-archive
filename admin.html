<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Silk Admin - 订单管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f5f5f7; font-family: -apple-system, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="text-4xl font-bold tracking-tight text-[#1d1d1f]">商户订单后台</h1>
                <p class="text-[#86868b] mt-2">实时监控商城流水、客户信息与订单状态</p>
            </div>
            <div class="flex gap-4">
                <button onclick="location.href='studio.html'" class="px-6 py-2 bg-blue-600 text-white rounded-full shadow-lg shadow-blue-100 text-sm font-bold transition hover:bg-blue-700">去装修首页(换图)</button>
                <button onclick="location.href='index.html'" class="px-6 py-2 bg-white rounded-full shadow-sm text-sm font-medium border">返回商城</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <div class="glass p-8 rounded-3xl">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">累计订单量</p>
                <h2 id="total-orders" class="text-5xl font-light">0</h2>
            </div>
            <div class="glass p-8 rounded-3xl">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">预估总销售额</p>
                <h2 id="total-sales" class="text-5xl font-light">¥ 0.00</h2>
            </div>
        </div>

        <div class="glass p-8 rounded-[2.5rem] overflow-hidden">
            <h3 class="text-xl font-bold mb-6">订单流水记录</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-gray-400 border-b border-gray-100 font-medium">
                        <tr>
                            <th class="pb-4">订单编号</th>
                            <th class="pb-4">客户详情</th>
                            <th class="pb-4">选购产品</th>
                            <th class="pb-4">实付金额</th>
                            <th class="pb-4">下单时间</th>
                            <th class="pb-4">当前状态</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body" class="divide-y divide-gray-50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function refreshData() {
            try {
                // 1. 加载统计概览
                const statsRes = await fetch('/api/admin/stats');
                const stats = await statsRes.json();
                document.getElementById('total-orders').innerText = stats.totalOrders;
                document.getElementById('total-sales').innerText = `¥ ${stats.totalSales}`;

                // 2. 加载详细订单流水
                const ordersRes = await fetch('/api/admin/orders');
                const orders = await ordersRes.json();
                
                const tbody = document.getElementById('order-table-body');
                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="py-20 text-center text-gray-400">暂无任何订单记录</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(o => `
                    <tr class="hover:bg-gray-50/50 transition duration-200">
                        <td class="py-5 font-mono text-xs text-gray-400">#${o.id}</td>
                        <td class="py-5">
                            <div class="font-bold text-gray-800">${o.customer_name}</div>
                            <div class="text-[10px] text-gray-400">${o.phone} | ${o.address}</div>
                        </td>
                        <td class="py-5 text-gray-600">${o.product_name}</td>
                        <td class="py-5 font-semibold text-blue-600">¥${o.price}</td>
                        <td class="py-5 text-gray-400 text-xs">${o.create_time || '刚刚'}</td>
                        <td class="py-5">
                            <span class="px-3 py-1 bg-green-100 text-green-600 rounded-full text-[10px] font-bold">待发货</span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("后台数据加载失败:", err);
            }
        }

        // 页面启动即刷新
        refreshData();
    </script>
</body>
</html>
