<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>M.W.S | 视觉引擎配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', "Microsoft YaHei", sans-serif; background: #fff; color: #000; }
        .modern-nav { background: rgba(255, 255, 255, 0.98); border-bottom: 2px solid #000; }
        
        .switch-input { display: none; }
        .switch-label {
            width: 44px; height: 22px; background: #eee;
            border-radius: 0; position: relative; cursor: pointer;
            transition: 0.3s; display: inline-block;
        }
        .switch-label::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; background: #fff; transition: 0.3s;
        }
        .switch-input:checked + .switch-label { background: #000; }
        .switch-input:checked + .switch-label::after { left: 24px; }

        .config-card { border: 1px solid #eee; transition: 0.4s; }
        .config-card:hover { border-color: #000; }

        .btn-press:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="modern-nav fixed top-0 w-full z-50 px-8 lg:px-12 py-6 flex justify-between items-center">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase">M.W.S / DESIGN</h1>
            <button onclick="location.href='admin-console.html'" class="text-[10px] font-bold tracking-widest btn-press">返回中枢</button>
        </div>
        <button id="save-btn" onclick="saveAllConfigs()" class="bg-black text-white px-8 py-3 text-[11px] font-black uppercase btn-press shadow-xl">应用全局变更</button>
    </nav>

    <main class="pt-40 px-8 lg:px-24 pb-24 max-w-7xl mx-auto">
        <header class="mb-20">
            <h2 class="text-6xl font-light tracking-tighter mb-4">视觉引擎</h2>
            <p class="text-[10px] font-bold text-zinc-400 tracking-[0.4em] uppercase font-bold">Display Engine & Layout Configuration</p>
            <div class="w-16 h-[2px] bg-black mt-8"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#01 / Banner 视觉</p>
                <h3 class="text-xl font-black mb-8">首屏大图管理</h3>
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold">自动轮播模式</span>
                        <input type="checkbox" id="autoPlay" class="switch-input">
                        <label for="autoPlay" class="switch-label"></label>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">当前首选大图 URL</p>
                        <input type="text" id="hero-url-input" class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition mb-4">
                        <button onclick="openUploadWidget('hero-url-input')" class="w-full py-3 bg-zinc-50 border border-zinc-200 text-[9px] font-bold tracking-[0.2em] uppercase hover:bg-black hover:text-white transition duration-500">
                            Cloudinary 智能上传
                        </button>
                    </div>
                </div>
            </section>

            <section class="config-card p-10">
                <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#02 / Announcements</p>
                <h3 class="text-xl font-black mb-8">全站置顶公告栏</h3>
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold">启用顶部通知</span>
                        <input type="checkbox" id="showNotice" class="switch-input">
                        <label for="showNotice" class="switch-label"></label>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">公告内容 (支持中文)</p>
                        <textarea id="noticeContent" class="w-full border border-zinc-100 p-4 text-sm outline-none focus:border-black transition h-24" placeholder="例如：2026 春夏系列现已开放预订"></textarea>
                    </div>
                </div>
            </section>
        </div>

        <section class="config-card p-10 mt-12">
            <p class="text-[9px] font-black text-zinc-300 uppercase tracking-widest mb-6">#05 / Footer Aesthetics</p>
            <h3 class="text-xl font-black mb-8">底部展示区域自定义</h3>
            <div class="space-y-6">
                <div>
                    <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">底部小标题 (e.g. 01. HERITAGE & CRAFT)</p>
                    <input type="text" id="footer-title-input" placeholder="输入标题..." class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition mb-4">
                </div>
                <div>
                    <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">底部描述文字</p>
                    <textarea id="footer-desc-input" class="w-full border border-zinc-100 p-4 text-sm outline-none focus:border-black transition h-20" placeholder="描述品牌理念..."></textarea>
                </div>
                <div>
                    <p class="text-[10px] font-bold mb-3 text-zinc-400 uppercase">底部展示图 URL</p>
                    <input type="text" id="footer-img-input" class="w-full border-b border-zinc-200 py-2 text-sm outline-none focus:border-black transition mb-4">
                    <button onclick="openUploadWidget('footer-img-input')" class="w-full py-3 bg-zinc-50 border border-zinc-200 text-[9px] font-bold tracking-[0.2em] uppercase hover:bg-black hover:text-white transition duration-500">
                        上传底部展示图
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const cloudName = "dbyud7vlz"; 
        const uploadPreset = "aliang"; 
        const ADMIN_AUTH_KEY = "MWS2026"; 

        // 通用上传组件，支持多个目标
        function openUploadWidget(targetId) {
            cloudinary.openUploadWidget({
                cloudName: cloudName,
                uploadPreset: uploadPreset,
                sources: ['local', 'url'],
                cropping: true,
                multiple: false,
                theme: "minimal"
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    document.getElementById(targetId).value = result.info.secure_url;
                }
            });
        }

        // 页面初始化：获取当前数据库配置
        async function fetchCurrentConfigs() {
            try {
                const res = await fetch('/api/settings');
                const config = await res.json();
                
                if (config.hero_banner) document.getElementById('hero-url-input').value = config.hero_banner;
                if (config.hero_autoplay) document.getElementById('autoPlay').checked = (config.hero_autoplay === "on");
                if (config.show_notice) document.getElementById('showNotice').checked = (config.show_notice === "true");
                if (config.notice_content) document.getElementById('noticeContent').value = config.notice_content;
                
                // 加载底部配置
                if (config.footer_title) document.getElementById('footer-title-input').value = config.footer_title;
                if (config.footer_desc) document.getElementById('footer-desc-input').value = config.footer_desc;
                if (config.footer_img) document.getElementById('footer-img-input').value = config.footer_img;
            } catch (err) {
                console.error("配置加载失败", err);
            }
        }

        async function saveAllConfigs() {
            const btn = document.getElementById('save-btn');
            
            // 构建发送到后端的数据包
            const payload = {
                "hero_banner": document.getElementById('hero-url-input').value,
                "hero_autoplay": document.getElementById('autoPlay').checked ? "on" : "off",
                "show_notice": document.getElementById('showNotice').checked ? "true" : "false",
                "notice_content": document.getElementById('noticeContent').value,
                "footer_title": document.getElementById('footer-title-input').value,
                "footer_desc": document.getElementById('footer-desc-input').value,
                "footer_img": document.getElementById('footer-img-input').value
            };

            btn.innerText = "正在同步云端...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-mws-auth': ADMIN_AUTH_KEY 
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.success) {
                    btn.innerText = "变更已全站生效";
                    btn.style.backgroundColor = "#16a34a";
                }
            } catch (err) {
                btn.innerText = "同步失败";
                btn.style.backgroundColor = "#dc2626";
            }

            setTimeout(() => {
                btn.innerText = "应用全局变更";
                btn.style.backgroundColor = "#000";
                btn.disabled = false;
            }, 2000);
        }

        // 入口启动
        window.onload = fetchCurrentConfigs;
    </script>
</body>
</html>
