<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>MWS | My Archive 个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; overflow-x: hidden; }
        
        /* 18px Montserrat 侧边栏样式 - 保持不变 */
        .nav-link-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #d1d1d1;
            margin-bottom: 35px;
            cursor: pointer;
            display: block;
            transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .nav-link-sub:hover, .nav-link-sub.active { color: #000; transform: translateX(10px); }

        /* 32px 大圆角卡片 - 保持不变 */
        .order-card {
            background: #fcfcfc;
            border-radius: 2rem;
            padding: 2.5rem;
            border: 1px solid #f0f0f0;
            transition: 0.5s;
        }
        .order-card:hover { border-color: #000; transform: translateY(-5px); }

        /* 头像组件 - 保持不变 */
        .avatar-box {
            width: 100px; height: 100px;
            border-radius: 50%;
            overflow: hidden;
            background: #f5f5f5;
            position: relative;
            cursor: pointer;
            border: 1px solid #eee;
        }
        .avatar-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s;
        }
        .avatar-box:hover .avatar-overlay { opacity: 1; }
    </style>
</head>
<body class="p-8 lg:p-20">

    <header class="flex justify-between items-center mb-24">
        <h1 class="text-xl font-bold tracking-[0.5em] uppercase cursor-pointer" onclick="location.href='index.html'">MR WANG SILK</h1>
        <button onclick="logout()" class="text-[10px] font-bold tracking-widest uppercase opacity-40 hover:opacity-100 transition">Logout</button>
    </header>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-24">
        <aside class="lg:col-span-4">
            <div class="mb-20">
                <div class="avatar-box" onclick="uploadAvatar()">
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=MWS" class="w-full h-full object-cover">
                    <div class="avatar-overlay">
                        <span class="text-[8px] text-white font-black tracking-widest uppercase">Change</span>
                    </div>
                </div>
                <h2 id="user-name" class="text-4xl font-light tracking-tighter mt-8 mb-2">Member</h2>
                <p id="user-email" class="text-[10px] text-zinc-400 tracking-[0.3em] uppercase">Verified Account</p>
                <p id="user-balance" class="text-[10px] text-black font-bold tracking-[0.2em] mt-4 uppercase">Balance: ¥0.00</p>
            </div>

            <nav>
                <div class="nav-link-sub active">My Orders / 我的订单</div>
                <div class="nav-link-sub">Address / 地址管理</div>
                <div class="nav-link-sub">Support / 售后服务</div>
            </nav>
        </aside>

        <main class="lg:col-span-8">
            <div id="order-list" class="space-y-8">
                <div class="order-card">
                    <p class="text-xs text-zinc-300 uppercase tracking-widest italic">No orders yet.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- 核心逻辑增强 ---
        
        // 从本地存储获取初始登录状态
        let user = JSON.parse(localStorage.getItem('mws_user'));

        async function init() {
            if (!user) {
                // 如果没登录，直接踢回首页
                location.href = 'index.html';
                return;
            }
            
            // 1. 立即渲染本地已有的缓存数据，让用户感觉加载很快
            renderUser(user);
            
            // 2. 异步从服务器同步最新资料（如最新的头像 URL、最新的余额）
            await syncUserData();
        }

        // 渲染用户信息到界面
        function renderUser(data) {
            if(data.nickname) document.getElementById('user-name').innerText = data.nickname;
            if(data.email) document.getElementById('user-email').innerText = data.email;
            if(data.avatar) document.getElementById('user-avatar').src = data.avatar;
            if(data.balance !== undefined) {
                document.getElementById('user-balance').innerText = `Balance: ¥${parseFloat(data.balance).toFixed(2)}`;
            }
        }

        // 从服务器抓取最新 Profile
        async function syncUserData() {
            try {
                // 使用 email 作为查询凭证
                const res = await fetch(`/api/user/profile?email=${encodeURIComponent(user.email)}`);
                const latestData = await res.json();
                
                if (latestData.success) {
                    // 合并数据并更新本地缓存
                    user = { ...user, ...latestData.user };
                    localStorage.setItem('mws_user', JSON.stringify(user));
                    // 重新渲染最新数据
                    renderUser(user);
                }
            } catch (err) {
                console.warn("Profile Sync Offline: 无法连接到服务器进行数据同步");
            }
        }

        // Cloudinary 头像上传逻辑
        function uploadAvatar() {
            cloudinary.openUploadWidget({
                cloudName: "dbyud7vlz", 
                uploadPreset: "aliang",
                cropping: true,
                croppingAspectRatio: 1,
                showSkipCropButton: false,
                multiple: false,
                styles: {
                    palette: {
                        window: "#FFFFFF",
                        sourceBg: "#F4F4F5",
                        windowBorder: "#90A0B3",
                        tabIcon: "#000000",
                        inactiveTabIcon: "#69778A",
                        menuIcons: "#000000",
                        link: "#000000",
                        action: "#000000",
                        inProgress: "#000000",
                        complete: "#20B832",
                        error: "#E57373",
                        textDark: "#000000",
                        textLight: "#FFFFFF"
                    }
                }
            }, async (error, result) => {
                if (!error && result.event === "success") {
                    const newUrl = result.info.secure_url;
                    
                    // 1. 视觉反馈：立即更新页面上的图片
                    document.getElementById('user-avatar').src = newUrl;
                    
                    // 2. 数据库持久化：调用 API 保存
                    await saveAvatarToDB(newUrl);
                }
            });
        }

        // 将新头像 URL 永久存入 Supabase 数据库
        async function saveAvatarToDB(url) {
            try {
                const res = await fetch('/api/user/update-avatar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, avatar: url })
                });
                const data = await res.json();
                if(data.success) {
                    // 同步本地缓存中的 avatar 字段
                    user.avatar = url;
                    localStorage.setItem('mws_user', JSON.stringify(user));
                    console.log("Database Sync Success");
                } else {
                    alert("头像保存失败: " + data.msg);
                }
            } catch (err) {
                console.error("Save Avatar Error:", err);
            }
        }

        function logout() {
            // 清除登录状态
            localStorage.removeItem('mws_user');
            // 返回首页
            location.href = 'index.html';
        }

        // 绑定初始化函数
        window.onload = init;
    </script>
</body>
</html>
