<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>THE ARCHIVE | MR WANG SILK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap');
        body { font-family: 'Inter', sans-serif; background: #fff; margin: 0; }
        .editorial-title { font-family: 'Montserrat', sans-serif; letter-spacing: 0.8em; text-transform: uppercase; }
        .content-body { line-height: 2.8; letter-spacing: 0.1em; color: #444; }
    </style>
</head>
<body>
    <header class="h-[120px] flex flex-col items-center justify-center border-b border-zinc-50 sticky top-0 bg-white/90 z-50">
        <h1 class="text-2xl font-light tracking-[0.5em] uppercase cursor-pointer" onclick="window.location.href='index.html'">MR WANG SILK</h1>
        <p class="text-[8px] tracking-[0.4em] text-gray-400 mt-2 uppercase">Brand Story / 品牌故事</p>
    </header>

    <main class="max-w-4xl mx-auto px-12 py-32 space-y-32">
        <section class="animate__animated animate__fadeIn">
            <span class="text-[10px] tracking-[0.4em] text-zinc-300 block mb-8 uppercase">Chapter 01</span>
            <h2 class="editorial-title text-4xl mb-12">溯源 / ORIGIN</h2>
            <p class="content-body text-sm text-justify">
                在杭州的晨雾与水气中，每一根丝线都承载着超越克重的重量。MR WANG SILK 不仅仅是一家陈列馆，它是对一种正在消失的“慢速美学”的守望。我们坚持使用 6A 级顶级桑蚕丝，在传统织机的每一次经纬交错中，找寻那种无法被工业化复刻的生命光泽。
            </p>
        </section>

        <section class="py-20 bg-black text-white text-center">
             <h3 class="text-xl font-light tracking-[0.3em] leading-relaxed italic">
                “我们捕捉的是光影在丝绸上的流动，而非仅仅是面料。”
            </h3>
        </section>

        <div class="text-center pt-20">
            <a href="index.html" class="border border-black px-12 py-4 text-[10px] tracking-[0.4em] hover:bg-black hover:text-white transition-all uppercase font-bold">
                Return / 返回陈列馆
            </a>
        </div>
    </main>
</body>
</html>
