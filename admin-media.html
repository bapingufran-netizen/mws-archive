<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>M.W.S | 资产管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', "Microsoft YaHei", sans-serif; 
            background: #ffffff; 
            color: #000000;
        }

        .modern-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid #000;
        }

        /* 媒体卡片悬停效果 */
        .media-card {
            border: 1px solid #f0f0f0;
            position: relative;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .media-card:hover {
            border-color: #000;
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .action-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .media-card:hover .action-overlay {
            opacity: 1;
        }

        .action-btn {
            width: 80%;
            padding: 10px 0;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        .btn-delete {
            color: #ff4d4f;
            border-color: rgba(255,77,79,0.3);
        }

        .btn-delete:hover {
            background: #ff4d4f;
            color: white;
            border-color: #ff4d4f;
        }

        .type-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: black;
            color: white;
            padding: 4px 10px;
            font-size: 8px;
            font-weight: 800;
            z-index: 10;
        }

        .loader {
            border-top-color: #000;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="modern-nav fixed top-0 w-full z-50 px-8 lg:px-12 py-6 flex justify-between items-center">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase">M.W.S / MEDIA</h1>
            <button onclick="location.href='admin-console.html'" class="text-[10px] font-bold tracking-widest hover:opacity-50 transition">返回控制台</button>
        </div>
        <div class="flex gap-4">
            <input type="file" id="fileUpload" class="hidden" onchange="handleFileSelect(this)" accept="image/*,video/*,audio/*">
            <button id="uploadBtn" onclick="document.getElementById('fileUpload').click()" class="px-8 py-3 bg-black text-white text-[11px] font-black uppercase shadow-lg hover:bg-zinc-800 transition active:scale-95">上传新素材</button>
        </div>
    </nav>

    <main class="pt-40 px-8 lg:px-12 pb-24">
        
        <div class="mb-20 flex flex-col md:flex-row justify-between items-end gap-12">
            <div class="w-full md:w-2/5">
                <p class="text-[9px] font-black text-zinc-400 uppercase tracking-[0.3em] mb-3">Asset Library Search</p>
                <input type="text" id="searchInput" placeholder="搜索资产名称或编号..." class="w-full border-b-2 border-zinc-100 py-3 text-lg outline-none focus:border-black transition" oninput="handleSearch()">
            </div>
            
            <div class="flex gap-10">
                <button onclick="filterType('ALL')" class="filter-btn text-[11px] font-black border-b-2 border-black pb-2">全部</button>
                <button onclick="filterType('IMAGE')" class="filter-btn text-[11px] font-bold text-zinc-400 hover:text-black transition pb-2">图片</button>
                <button onclick="filterType('VIDEO')" class="filter-btn text-[11px] font-bold text-zinc-400 hover:text-black transition pb-2">视频</button>
                <button onclick="filterType('AUDIO')" class="filter-btn text-[11px] font-bold text-zinc-400 hover:text-black transition pb-2">音频</button>
            </div>
        </div>

        <div id="mediaGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
            </div>

    </main>

    <script>
        // --- 配置信息 ---
        const CLOUD_NAME = "dbyud7vlz"; 
        const UPLOAD_PRESET = "mws_assets"; 

        let allAssets = [];

        // 初始化加载
        window.onload = loadAssets;

        async function loadAssets() {
            const grid = document.getElementById('mediaGrid');
            try {
                const res = await fetch('/api/media');
                allAssets = await res.json();
                renderGrid(allAssets);
            } catch (err) {
                grid.innerHTML = `<p class="text-red-500 text-xs uppercase">无法连接到数据库</p>`;
            }
        }

        function renderGrid(data) {
            const grid = document.getElementById('mediaGrid');
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-300 text-xs tracking-widest uppercase">存档库为空 / Archive Empty</div>`;
                return;
            }
            grid.innerHTML = data.map(item => `
                <div class="media-card group">
                    <span class="type-tag">${item.type}</span>
                    <div class="aspect-square bg-zinc-50 overflow-hidden relative">
                        <img src="${item.url}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000">
                        <div class="action-overlay">
                            <button class="action-btn" onclick="copyLink('${item.url}')">复制链接</button>
                            <button class="action-btn" onclick="window.open('${item.url}')">全屏预览</button>
                            <button class="action-btn btn-delete" onclick="deleteAsset(${item.id})">删除资产</button>
                        </div>
                    </div>
                    <div class="p-5 bg-white">
                        <p class="text-[8px] font-bold text-zinc-300 mb-2 tracking-widest uppercase">Asset ID: #0${item.id}</p>
                        <h3 class="text-[12px] font-black tracking-widest uppercase truncate">${item.tag || '未命名素材'}</h3>
                    </div>
                </div>
            `).join('');
        }

        // --- 核心：Cloudinary 上传逻辑 ---
        async function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const btn = document.getElementById('uploadBtn');
            const originalText = btn.innerText;
            btn.innerText = "正在同步云端...";
            btn.disabled = true;

            try {
                // 1. 上传至 Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);

                const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const cloudData = await cloudRes.json();

                if (!cloudData.secure_url) throw new Error("云端回传失败");

                // 2. 将 URL 存入本地数据库
                let assetType = 'IMAGE';
                if (file.type.includes('video')) assetType = 'VIDEO';
                if (file.type.includes('audio')) assetType = 'AUDIO';

                const assetData = {
                    type: assetType,
                    tag: file.name.split('.')[0].toUpperCase(),
                    url: cloudData.secure_url
                };

                const res = await fetch('/api/media', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(assetData)
                });

                if (res.ok) {
                    alert("同步完成：资产已永久归档");
                    loadAssets();
                }
            } catch (err) {
                alert("上传失败，请检查 Cloudinary 配置");
                console.error(err);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                input.value = "";
            }
        }

        async function deleteAsset(id) {
            if(!confirm('确定要从数据库中永久销毁此资产吗？')) return;
            const res = await fetch(`/api/media/${id}`, { method: 'DELETE' });
            if (res.ok) loadAssets();
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            alert("链接已复制");
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allAssets.filter(a => a.tag.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function filterType(type) {
            // 更新 UI 样式
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('border-black', 'text-black');
                b.classList.add('text-zinc-400');
            });
            event.target.classList.add('border-black', 'text-black');

            if (type === 'ALL') renderGrid(allAssets);
            else renderGrid(allAssets.filter(a => a.type === type));
        }
    </script>
</body>
</html>
