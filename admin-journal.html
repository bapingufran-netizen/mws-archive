<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>M.W.S | 叙事志档案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', "Microsoft YaHei", sans-serif; background: #fff; color: #000; overflow-x: hidden; }
        
        .modern-nav { background: rgba(255, 255, 255, 0.98); border-bottom: 2px solid #000; }

        /* 搜索引擎交互 */
        .search-wrapper { position: relative; }
        .journal-search {
            width: 100%; border: none; border-bottom: 2px solid #eee;
            padding: 15px 0; font-size: 20px; outline: none; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .journal-search:focus { border-bottom-color: #000; transform: translateY(-2px); }

        /* 分类按钮交互 */
        .cat-btn {
            font-size: 11px; font-weight: 800; color: #ccc; letter-spacing: 0.2em;
            transition: 0.3s; padding-bottom: 8px; border-bottom: 2px solid transparent;
        }
        .cat-btn.active { color: #000; border-bottom-color: #000; }
        .cat-btn:hover:not(.active) { color: #666; }

        /* 列表行交互 */
        .journal-row {
            border-bottom: 1px solid #f2f2f2;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
        }
        .journal-row:hover { background: #fafafa; padding-left: 20px; }

        /* 编辑器全屏弹出动画 */
        #editorOverlay {
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #editorOverlay.active { transform: translateY(0); }

        /* 按钮点击波纹反馈 */
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }

        /* 封面预览区样式 */
        .cover-dropzone {
            width: 100%; height: 300px; background: #fafafa;
            border: 2px dashed #eee; display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; overflow: hidden;
        }
        .cover-dropzone:hover { border-color: #000; }
        .cover-dropzone img { width: 100%; height: 100%; object-cover: cover; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="modern-nav fixed top-0 w-full z-50 px-8 lg:px-12 py-6 flex justify-between items-center">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase">M.W.S / JOURNAL</h1>
            <button onclick="location.href='admin-console.html'" class="text-[10px] font-bold tracking-widest btn-press">返回中枢</button>
        </div>
        <button onclick="openEditor()" class="bg-black text-white px-8 py-3 text-[11px] font-black uppercase btn-press">撰写新章节</button>
    </nav>

    <main class="pt-44 px-8 lg:px-24 pb-24">
        
        <div class="mb-24 space-y-14">
            <div class="search-wrapper">
                <p class="text-[9px] font-black text-zinc-400 uppercase tracking-[0.3em] mb-3">INTERNAL SEARCH / 搜索</p>
                <input type="text" id="journalSearch" placeholder="输入标题、日期或核心关键词..." class="journal-search font-light" oninput="handleLiveSearch()">
            </div>

            <div class="flex gap-12">
                <button onclick="switchCategory('ALL')" class="cat-btn active" id="cat-ALL">全部内容</button>
                <button onclick="switchCategory('匠心工艺')" class="cat-btn" id="cat-匠心工艺">匠心工艺</button>
                <button onclick="switchCategory('品牌动态')" class="cat-btn" id="cat-品牌动态">品牌动态</button>
                <button onclick="switchCategory('穿搭志')" class="cat-btn" id="cat-穿搭志">穿搭志</button>
            </div>
        </div>

        <div id="journalContainer" class="space-y-0">
            <p class="text-zinc-300 text-xs italic tracking-widest uppercase">正在检索档案库 / RETRIEVING ARCHIVES...</p>
        </div>

    </main>

    <div id="editorOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col p-12 lg:p-24 overflow-y-auto">
        <div class="flex justify-between items-center mb-20">
            <button onclick="closeEditor()" class="text-[11px] font-black tracking-widest btn-press">← 取消编辑 / EXIT</button>
            <div class="flex gap-6">
                <button id="saveDraftBtn" class="text-[11px] font-bold border border-zinc-200 px-8 py-3 btn-press">暂存草稿</button>
                <button id="publishBtn" onclick="publishPost()" class="bg-black text-white px-10 py-3 text-[11px] font-black btn-press uppercase">发布至官网</button>
            </div>
        </div>
        
        <div class="max-w-4xl mx-auto w-full space-y-12 pb-20">
            <div class="space-y-4">
                <p class="text-[10px] font-black text-zinc-400 uppercase tracking-widest">CHAPTER COVER / 文章封面</p>
                <div class="cover-dropzone" onclick="document.getElementById('coverInput').click()">
                    <img id="coverPreview" class="hidden">
                    <div id="coverPlaceholder" class="text-center">
                        <p class="text-[10px] font-bold text-zinc-300 uppercase tracking-widest">点击同步高清封面图至云端</p>
                    </div>
                </div>
                <input type="file" id="coverInput" class="hidden" accept="image/*" onchange="handleCoverUpload(this)">
            </div>

            <div class="border-b border-black pb-4">
                <p class="text-[10px] font-black text-zinc-400 mb-2 uppercase">CATEGORY / 分类</p>
                <select id="postCategory" class="w-full text-sm font-bold bg-transparent outline-none cursor-pointer">
                    <option>匠心工艺</option><option>品牌动态</option><option>穿搭志</option>
                </select>
            </div>
            
            <input type="text" id="postTitle" placeholder="在此处输入章节标题..." class="w-full text-5xl font-black border-none outline-none placeholder:text-zinc-100">
            <textarea id="postContent" class="w-full min-h-[500px] text-xl leading-relaxed outline-none placeholder:text-zinc-100" placeholder="开始您的品牌叙事..."></textarea>
        </div>
    </div>

    <script>
        // --- 核心配置 ---
        const CLOUD_NAME = "dbyud7vlz";
        const UPLOAD_PRESET = "mws_assets";

        let journals = [];
        let activeFilter = 'ALL';
        let currentCoverUrl = "";

        window.onload = loadJournals;

        // 加载真实后端数据
        async function loadJournals() {
            try {
                const res = await fetch('/api/journal');
                journals = await res.json();
                renderList(journals);
            } catch (err) {
                console.error("加载失败:", err);
            }
        }

        // --- 云端上传工具 ---
        async function handleCoverUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const publishBtn = document.getElementById('publishBtn');
            publishBtn.innerText = "同步云端中...";
            publishBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                currentCoverUrl = data.secure_url;

                // 预览渲染
                const img = document.getElementById('coverPreview');
                img.src = currentCoverUrl;
                img.classList.remove('hidden');
                document.getElementById('coverPlaceholder').classList.add('hidden');
            } catch (err) {
                alert("云端同步失败");
            } finally {
                publishBtn.innerText = "发布至官网";
                publishBtn.disabled = false;
            }
        }

        function renderList(data) {
            const container = document.getElementById('journalContainer');
            if (data.length === 0) {
                container.innerHTML = `<p class="py-20 text-zinc-300 text-sm tracking-widest text-center border-t border-zinc-100 uppercase">Archive Empty / 暂无叙事记录</p>`;
                return;
            }
            container.innerHTML = data.map((item, idx) => `
                <div class="journal-row flex items-center py-10 group">
                    <div class="w-20 text-[10px] font-black text-zinc-200">#0${item.id}</div>
                    <div class="flex-1 px-6">
                        <h3 class="text-xl font-black tracking-widest">${item.title}</h3>
                        <p class="text-[9px] text-zinc-400 mt-2 font-bold uppercase tracking-[0.2em]">FILE DATE: ${item.date || 'UNSET'}</p>
                    </div>
                    <div class="w-32 text-[10px] font-black uppercase tracking-widest">${item.category}</div>
                    <div class="w-32">
                        <span class="text-[9px] font-black ${item.status === '已发布' ? 'bg-black text-white' : 'border border-zinc-200 text-zinc-400'} px-3 py-1 uppercase">
                            ${item.status}
                        </span>
                    </div>
                    <div class="w-40 text-right">
                        <button class="text-[10px] font-black text-red-600 opacity-0 group-hover:opacity-100 transition-opacity" onclick="deleteItem(${item.id}, event)">删除档案</button>
                    </div>
                </div>
            `).join('');
        }

        function switchCategory(cat) {
            activeFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`cat-${cat}`).classList.add('active');
            handleLiveSearch();
        }

        function handleLiveSearch() {
            const query = document.getElementById('journalSearch').value.toLowerCase();
            const filtered = journals.filter(j => {
                const matchQuery = (j.title || "").toLowerCase().includes(query);
                const matchCat = activeFilter === 'ALL' || j.category === activeFilter;
                return matchQuery && matchCat;
            });
            renderList(filtered);
        }

        function openEditor() {
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            document.getElementById('coverPreview').classList.add('hidden');
            document.getElementById('coverPlaceholder').classList.remove('hidden');
            currentCoverUrl = "";
            document.getElementById('editorOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEditor() {
            document.getElementById('editorOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        async function publishPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            if(!title || !content) return alert("请完整填写标题与叙事内容");

            const postData = {
                title: title,
                content: content,
                category: document.getElementById('postCategory').value,
                status: '已发布',
                // 这里将云端封面图存入
                cover: currentCoverUrl 
            };

            const res = await fetch('/api/journal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            });

            if(res.ok) {
                alert("章节已成功入库。");
                loadJournals();
                closeEditor();
            }
        }

        async function deleteItem(id, e) {
            e.stopPropagation();
            if(confirm("确认永久销毁该叙事档案吗？此操作不可逆。")) {
                const res = await fetch(`/api/journal/${id}`, { method: 'DELETE' });
                if(res.ok) loadJournals();
            }
        }
    </script>
</body>
</html>
